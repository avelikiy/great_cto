# The share-report worker: greatcto.systems/r/*  (source: share-worker.js)
#
# Deploy:  npx wrangler deploy -c wrangler.share.toml
#
# The R2 bucket is the one the deployed worker has been bound to since 2026-04-30
# (checked with `wrangler versions view` on 2026-11-11).
#
# The bucket has a lifecycle rule `expire-reports`: objects under r/ are deleted
# 31 days after their last write. Every page write sets expires_at at most 30 days
# ahead (MAX_TTL_SEC), so the rule only removes reports that have already expired
# and were never opened again.
name = "great-cto-share"
main = "share-worker.js"
compatibility_date = "2025-01-01"
account_id = "8b4c82576661609fadcac6ae8a5b2708"

routes = [
  { pattern = "greatcto.systems/r/*", zone_name = "greatcto.systems" },
]

[[r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "great-cto-share"

# Set to "1" only after boards older than the release that introduced manage keys
# are out of use: it stops a report published without a key from being paused.
# [vars]
# REQUIRE_MANAGE_KEY = "1"
