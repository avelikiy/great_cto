name: Runtime CI

# Runs the test buckets that no other workflow covers:
#   - repo-root tests/*.test.mjs  (board-gate, pipeline-*, product-owner-wiring, …)
#   - tests/hooks/*.test.mjs      (PreToolUse / SubagentStop hook logic)
#   - packages/board/*.test.mjs   (board push-adapter)
# cli-ci's `tests/*.test.mjs` runs with working-directory packages/cli, so it only
# sees packages/cli/tests — the repo-root and board tests were orphaned. They use only
# node: builtins, but some board tests import the built CLI (packages/cli/dist), so the
# CLI is built first: without it agent-events, bundle-imports and decision-log-survives
# fail for a missing dist, not for what they test.

on:
  push:
    branches: [main]
    paths:
      - "packages/board/**"
      - "packages/cli/src/**"
      - "workers/**"
      - "tests/**"
      - "scripts/**"
      - "shared/**"
      - "agents/**"
      - "commands/**"
      - ".github/workflows/runtime-ci.yml"
  pull_request:
    paths:
      - "packages/board/**"
      - "packages/cli/src/**"
      - "workers/**"
      - "tests/**"
      - "scripts/**"
      - "shared/**"
      - "agents/**"
      - "commands/**"
      - ".github/workflows/runtime-ci.yml"

jobs:
  runtime-tests:
    name: Board + root integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/cli/package-lock.json
      - name: Build the CLI (board tests import packages/cli/dist)
        working-directory: packages/cli
        run: npm ci && npm run build
      - name: Run orphaned runtime tests (root + hooks + board)
        run: node --test tests/*.test.mjs tests/hooks/*.test.mjs packages/board/*.test.mjs
      - name: Lint agent artifacts (structure + freshness)
        run: node scripts/hooks/artifact-lint.mjs --enforce
