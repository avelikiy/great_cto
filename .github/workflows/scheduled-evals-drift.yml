name: Scheduled Eval Drift

# Periodically re-runs the holdout eval set and alerts on pass-rate drift — the
# learning loop's automatic regression alarm (DEEPEN W3.6).
#
# The cron was gated on the actor-fidelity fix (a9tp) bringing baseline stddev
# ≤ 0.1. That has landed, and the noise gate now measures what it claims to:
# it reads 0.07 from the runs that actually sampled more than once, where it
# previously read 0.00 by averaging in 416 single-sample rows whose stddev is 0
# because nothing was observed twice.
#
# `--split holdout` is passed to the drift check as well as the runner. Without
# it the check compared this holdout run against whatever ran last — the history
# interleaves 285 holdout, 148 full-split and 5 tuning rows — and the same eval
# read as a 0.11 regression or a 0.16 improvement depending only on adjacency.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC

jobs:
  drift:
    name: Re-run holdout evals + detect drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run holdout evals (multi-sample, majority-judge)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node tests/eval/runner.mjs --split holdout --samples 3 --judge-votes 3 || true
      - name: Detect drift (refuses to alert if signal is noisy or unmeasured)
        run: node scripts/lib/eval-drift.mjs --split holdout --samples 3 --window 5 --threshold 0.1 --max-noise 0.1
