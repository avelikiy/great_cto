name: Plugin CI

on:
  push:
    branches: [main, master]
    paths:
      - "commands/**"
      - "agents/**"
      - "skills/**"
      - ".claude-plugin/**"
      - "tests/**"
      - ".github/workflows/plugin-ci.yml"
  pull_request:
    paths:
      - "commands/**"
      - "agents/**"
      - "skills/**"
      - ".claude-plugin/**"
      - "tests/**"
      - ".github/workflows/plugin-ci.yml"

jobs:
  structural:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the changed-agents coverage diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin contracts
        run: python3 tests/structural/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Docs reference in sync with agents/commands
        run: node scripts/gen-docs-reference.mjs --check
      - name: Docs reference generator tests
        run: node --test tests/docs/*.test.mjs
      - name: Eval-infra unit tests (runner / gate / gp-schema / coverage / cost-meter)
        run: node --test tests/eval/runner.test.mjs tests/eval/eval-gate.test.mjs tests/eval/gp-schema.test.mjs tests/eval/coverage-gate.test.mjs scripts/lib/cost-meter.test.mjs
      # A ratchet, not a wall. Holding every edited agent to `exercised` would
      # block 68 of 69 on day one and stop all work, so the existing debt stays
      # visible and non-blocking while NEW debt cannot be added: an agent
      # introduced in this PR needs an EVAL that has actually run, not one that
      # merely exists. "A file names the agent" is what the old single-number
      # coverage counted, and it measured nothing.
      - name: Agent → EVAL coverage gate (changed agents)
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          ADDED=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- 'agents/*.md' | tr '\n' ' ')
          EDITED=$(git diff --name-only --diff-filter=M "$BASE"...HEAD -- 'agents/*.md' | tr '\n' ' ')

          if [ -n "$EDITED" ]; then
            echo "Edited agents (bar: an EVAL exists): $EDITED"
            node scripts/coverage-gate.mjs --changed $EDITED --require present
          fi

          if [ -n "$ADDED" ]; then
            echo "New agents (bar: an EVAL that has been executed): $ADDED"
            node scripts/coverage-gate.mjs --changed $ADDED --require exercised
          fi

          if [ -z "$ADDED$EDITED" ]; then
            echo "No agent files changed — coverage gate skipped."
          fi

  archetype-e2e:
    name: Archetype detection e2e (23 fixtures)
    runs-on: ubuntu-latest
    needs: structural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/cli/package-lock.json
      - name: Install & build CLI
        working-directory: packages/cli
        run: npm ci && npm run build
      - name: Run fixture-based e2e suite
        run: node tests/run-archetype-e2e.mjs
