name: JSR publication admission (blocked)

# JSR transforms and republishes sources rather than the admitted npm tarball.
# Until that separate artifact contract exists, neither a tag nor a manual run
# may obtain publishing credentials or execute a registry helper.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission_required:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse unimplemented JSR artifact admission
        shell: bash
        run: |
          echo 'BLOCKED: verified JSR publication is not implemented; no registry operation was attempted.' >&2
          exit 1
