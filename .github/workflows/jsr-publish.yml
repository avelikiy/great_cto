name: Publish to JSR

# Mirrors npm publish to JSR (JavaScript Registry).
# JSR auto-generates docs from JSDoc comments + improves discovery.
# https://jsr.io/docs/publishing-packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for JSR OIDC publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build
        working-directory: packages/cli
        run: npm run build

      - name: Publish to JSR
        working-directory: packages/cli
        run: npx jsr publish --allow-dirty
        continue-on-error: true   # JSR config may not exist yet — don't block npm publish
