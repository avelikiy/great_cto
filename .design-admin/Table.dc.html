<div style="padding:56px 64px; display:flex; flex-direction:column; gap:44px; max-width:1280px;">

  <div style="display:flex; flex-direction:column; gap:12px;">
    <div class="h" style="color:#00d97e;">02 — The dense table</div>
    <div style="font-size:38px; font-weight:500; letter-spacing:-0.02em; line-height:1.15;">Where an admin is actually different</div>
    <div style="font-size:16px; color:#8a9a92; max-width:820px; line-height:1.6;">Nobody chooses a tool because its admin looks unique. They choose it because it is fast to read at 3am. Differentiation here is <span style="color:#ecf2ee;">behavioural</span> — the twenty-four rows of <span style="color:#ecf2ee;">--domain dense</span>, four of which came from a real corpus rather than reasoning.</div>
  </div>

  <div style="border:1px solid #1e272c;">
    <div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #1e272c;">
      <span style="font-size:14px;border-bottom:2px solid #00d97e;padding-bottom:4px;">All tasks</span>
      <span style="font-size:14px;color:#8a9a92;">Waiting on you</span>
      <span style="font-size:14px;color:#8a9a92;">Blocked 72h</span>
      <span style="margin-left:auto;font-size:13px;color:#8a9a92;">density <span style="color:#ecf2ee;">compact</span></span>
      <span style="border:1px solid #1e272c;padding:5px 10px;font-size:13px;color:#8a9a92;">Create view</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid #1e272c;background:#11161a;">
      <span style="font-size:13px;">Selected 50 on this page</span>
      <span style="font-size:13px;color:#00d97e;border-bottom:1px solid #00d97e;">Select all 4,312 matching</span>
      <span style="margin-left:auto;font-size:13px;color:#8a9a92;">12 hidden by the current filter</span>
    </div>
    <table style="font-size:14px;">
      <tr>
        <th class="h" style="width:34px;padding-left:16px;">☐</th><th class="h" style="width:150px;">id</th>
        <th class="h">title</th><th class="h" style="width:120px;">agent</th><th class="h" style="width:110px;">cost</th>
      </tr>
      <tr><td style="padding-left:16px;">☑</td><td style="color:#8a9a92;">great_cto-1rc8</td><td>ci-local board suite is not robust under its own load</td><td style="color:#8a9a92;">qa-engineer</td><td style="font-variant-numeric:tabular-nums;">$0.42</td></tr>
      <tr><td style="padding-left:16px;">☑</td><td style="color:#8a9a92;">great_cto-q894</td><td>lesson-rule: a try that does work, catch that says nothing</td><td style="color:#8a9a92;">senior-dev</td><td style="color:#8b958c;">—</td></tr>
      <tr><td style="padding-left:16px;">☐</td><td style="color:#8a9a92;">great_cto-o6j8</td><td>decide the accent on light ground</td><td style="color:#8b958c;">— not set</td><td style="color:#8b958c;">—</td></tr>
    </table>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
    <div class="box" style="border-color:#00d97e;display:flex;flex-direction:column;gap:10px;">
      <div class="h" style="color:#00d97e;">Two dashes, two meanings</div>
      <div style="font-size:14px;color:#8a9a92;line-height:1.6;"><span style="color:#8b958c;">—</span> in <span style="color:#ecf2ee;">cost</span> means never measured. <span style="color:#8b958c;">— not set</span> in <span style="color:#ecf2ee;">agent</span> means nobody has assigned one. A blank cell would say neither. Row from the corpus: <span style="color:#ecf2ee;">an empty cell must say whether it is empty or unknown</span> — grounded in rox.com, which renders explicit placeholders rather than blanks.</div>
    </div>
    <div class="box" style="display:flex;flex-direction:column;gap:10px;">
      <div class="h">Select-all says what it selected</div>
      <div style="font-size:14px;color:#8a9a92;line-height:1.6;">The header checkbox takes the PAGE and offers the 4,312. The bar states the count, the filter, and how many the filter hides. "Select all" that silently means one page while the action reads "Delete all" is the corpus's CRITICAL row.</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px;">
    <div style="display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #ecf2ee;padding-bottom:10px;">
      <div style="font-size:20px;font-weight:500;">Creating a view — the four steps, from flow 10809</div>
      <div style="font-size:14px;color:#8a9a92;">Rox · goal / action / system response</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #1e272c;">
      <div style="padding:18px;border-right:1px solid #1e272c;display:flex;flex-direction:column;gap:8px;"><div class="h">1 · from the table</div><div style="font-size:13px;color:#8a9a92;line-height:1.55;"><span style="color:#ecf2ee;">Create view</span> in the header. The table dims but <span style="color:#ecf2ee;">stays visible</span> — you are naming what you can see.</div></div>
      <div style="padding:18px;border-right:1px solid #1e272c;display:flex;flex-direction:column;gap:8px;"><div class="h">2 · name it</div><div style="font-size:13px;color:#8a9a92;line-height:1.55;">One input, focused. Columns and rows behind are unchanged and will be what the view stores.</div></div>
      <div style="padding:18px;border-right:1px solid #1e272c;display:flex;flex-direction:column;gap:8px;"><div class="h">3 · create</div><div style="font-size:13px;color:#8a9a92;line-height:1.55;">Modal closes, control returns to the table.</div></div>
      <div style="padding:18px;display:flex;flex-direction:column;gap:8px;"><div class="h" style="color:#00d97e;">4 · confirmed</div><div style="font-size:13px;color:#8a9a92;line-height:1.55;">A <span style="color:#ecf2ee;">tab appears</span> beside the default <em style="font-style:normal;color:#ecf2ee;">and</em> a toast says "View added." Two confirmations, because one is missable.</div></div>
    </div>
  </div>

  <div class="box" style="border-color:#fcd34d;display:flex;flex-direction:column;gap:10px;">
    <div class="h" style="color:#fcd34d;">AI on a table is a flow, not a button</div>
    <div style="font-size:14px;color:#8a9a92;line-height:1.6;max-width:860px;">Refero tags <span style="color:#ecf2ee;">AI Assistant</span> on every step of the Rox accounts flow, and "Creating new table column using AI" runs <span style="color:#ecf2ee;">twelve steps</span>. So: prompt → pending → <span style="color:#ecf2ee;">preview before commit</span> → accept or discard, and generated values stay marked as generated until a human confirms them. A sparkle button that writes straight into the data is the CRITICAL anti-pattern.</div>
  </div>
