# great_cto orchestrator contract
# Machine-readable rules for multi-agent coordination.
# Prose in coordinator.md and CLAUDE.md can be argued around; booleans cannot.
# Loaded at SubagentStart — agents that skip reading this violate the contract silently.

[parallelism]
# Require a Decomposition Matrix table before any Large task starts.
# Format: stream | write-zone | depends-on | why-parallel-safe
decomposition_matrix_required = true

# Inline subagent dispatch (claude -p "...") is forbidden.
# Only Agent tool calls with subagent_type specified are permitted.
inline_subagents_allowed = false

# Independent tool calls go out together, not one per turn.
#
# From Anthropic's "Prompting Claude Fable 5.1": in coding and bash-and-editor
# loops — where the next independent calls are implied by the task rather than
# named in the request — the model may issue them one per turn. Quality is
# unaffected; each extra turn costs a round trip and wall-clock time.
batch_independent_tool_calls = true

# A lead agent may continue working while the subagents it dispatched run.
#
# Same source: "don't force the lead agent to stop and wait for each one...
# letting the lead continue while subagents run lowers average time to
# completion at similar quality, token usage, and cost."
#
# The ceiling below has been 5 since this file was written; when the measurement
# went in the observed peak was 2. coordinator.md prescribed `background: true`
# for Fork (read-only research) and said nothing for Spawn, the mode that does
# the work — and "don't peek mid-flight" reads as "wait quietly" unless the
# alternative is stated.
lead_may_continue_during_subagents = true

# Maximum number of concurrent implementation streams.
# Research and verification streams are not counted toward this limit.
max_parallel_streams = 5

[authorization]
# The coordinator must emit the exact phrase below before the DISPATCH phase.
# No exceptions — even when the caller says "just do it".
spawn_phrase_required = true
spawn_phrase = "I explicitly authorize spawning parallel subagents"

[completion]
# Every work packet must record all three states before it can be marked DONE.
# completion_event alone is not sufficient — agents return without delivering.
three_state_completion = true

# completion_event : the agent returned (subagent call resolved)
# artifact         : the expected file/output actually exists and is non-empty
# acceptance       : the artifact was verified against the acceptance criterion

# Require written evidence that acceptance was checked.
acceptance_evidence_required = true

[ownership]
# An agent may not write to files outside its WPL owned-files list.
# Overlap detected at dispatch time → force sequential, add WPL dependency.
strict_file_ownership = true

# Minimum: must check for ownership overlap before dispatching ≥2 implementation agents.
overlap_check_required = true

[verify]
# Commands re-run to check an agent's verdict, when
# GREAT_CTO_VERIFY_EXECUTION=1 is set. See scripts/lib/execution-claims.mjs.
#
# This file is the repository owner's; agents do not write it. That is the whole
# point: the first version of this rung took the command from the verdict's own
# meta, and security review found that any agent able to Write a file could plant
# one under another agent's name and get unattended execution — without a Bash
# grant of its own.
#
# Only four command shapes are accepted, and only the project's own scripts run:
#   node --test <paths>   npm test   npm run <script>   bash scripts/<name>.sh
#
# Empty by default. An agent with no entry here is not verified at this rung,
# which is the honest state rather than a silent pass.
